name: ORT scan time test
run-name: ORT scan time test
on:
  push:
    branches:
      - 'test/ort-ci'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Scan:
    name: ORT scan (time measurement)
    if: github.repository_owner == 'rcar-community'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    env:
      ORT_WORK: ${{ github.workspace }}/ort-work
      ORT_USER: '1000:1000'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Prepare
        shell: bash
        run: |
          nproc; free -h; df -h /; docker --version
          mkdir -p "$ORT_WORK/in"
          cp scripts/ort/test-input/image.spdx.json "$ORT_WORK/in/"
          pip3 install pyyaml

      - name: Analyze
        shell: bash
        run: scripts/ort/run.sh analyze

      - name: Scan (diagnosis)
        shell: bash
        env:
          ORT_JAVA_OPTS: -Xmx10g
          ORT_LOG_OPT: --info
          ORT_DOCKER_OPTS: --name ort-scan
        run: |
          # Find out why the scan stalls (resources or something else).
          START=$(date +%s)
          mkdir -p diag
          ( while sleep 300; do
              M=$(( ($(date +%s) - START) / 60 ))
              {
                echo "=== $M min: scanner storage $(du -sm "$ORT_WORK/ortdata/scanner" 2>/dev/null | cut -f1) MB"
                uptime; free -m | sed -n 2p
                docker stats --no-stream ort-scan
                docker exec ort-scan ps -eo pid,pcpu,pmem,etime,args --sort=-pcpu | head -8 | cut -c1-200
                docker exec ort-scan sh -c 'ls /w/ortdata 2>/dev/null; du -sm /w/ortdata/* 2>/dev/null'
              } >> diag/status.log 2>&1
              PID=$(docker exec ort-scan pgrep -o java 2>/dev/null)
              [ -n "$PID" ] && docker exec ort-scan jcmd "$PID" Thread.print > "diag/threads-$M.txt" 2>&1
              tail -3 diag/status.log
            done ) &
          rc=0; timeout 90m scripts/ort/run.sh scan > diag/scan.log 2>&1 || rc=$?
          echo "scan stopped rc=$rc"
          docker ps -q | xargs -r docker stop
          tail -50 diag/scan.log
          # 124 = stopped by the time box (expected). Anything else is a failure.
          [ "$rc" = 0 ] || [ "$rc" = 124 ]

      - name: Upload diagnosis
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ort-diag
          path: diag
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload scanner storage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ort-scanner-storage
          path: ${{ env.ORT_WORK }}/ortdata/scanner
          retention-days: 7
          if-no-files-found: ignore
