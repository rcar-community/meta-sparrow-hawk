name: PR build test Yocto BSP for Sparrow-hawk
run-name: PR build test Yocto BSP for Sparrow-hawk
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Build:
    name: Build
    if: github.repository_owner == 'rcar-community'
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup build environment
        uses: ./.github/workflows/setup_build_env

      - name: Run build
        shell: bash
        run: |
          ./build.sh --console --rm-work
          ./build.sh --weston  --rm-work

      - name: Upload build logs
        if: failure()
        uses: ./.github/workflows/upload_build_logs
