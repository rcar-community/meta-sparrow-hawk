name: Build test for Sparrow-hawk
run-name: Build test for Sparrow-hawk
on:
  push:
    branches:
      - 'scarthgap'
      - '*-dev'
      - '*-next'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Build:
    name: Build (${{ matrix.name }})
    if: github.repository_owner == 'rcar-community'
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-dummy
            commands: |
              ./build.sh --console --rm-work --kernel-version dummy
          - name: kernel-6.12
            commands: |
              ./build.sh --console --rm-work --kernel-version 6.12
              ./build.sh --weston  --rm-work --kernel-version 6.12
          - name: minimal-sdk
            commands: |
              ./build.sh --console --rm-work --sdk
          - name: weston-sdk
            commands: |
              ./build.sh --weston --rm-work --sdk
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup build environment
        uses: ./.github/workflows/setup_build_env

      - name: Run build
        shell: bash
        run: ${{ matrix.commands }}

      - name: Upload build logs
        if: failure()
        uses: ./.github/workflows/upload_build_logs
        with:
          suffix: -${{ matrix.name }}
