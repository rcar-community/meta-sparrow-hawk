name: Release Yocto BSP for Sparrow-hawk
run-name: Release Yocto BSP for Sparrow-hawk
on:
  push:
    branches:
      - 'scarthgap'
      - '*-dev'
      - '*-next'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  Release:
    name: Release
    if: github.repository_owner == 'rcar-community'
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # The release notes list the commits since the previous release tag
          fetch-depth: 0
          fetch-tags: true

      - name: Setup build environment
        uses: ./.github/workflows/setup_build_env

      - name: Run build
        shell: bash
        run: |
          ./build.sh --console --sbom --rm-work
          ./build.sh --weston --sbom --rm-work

      - name: Upload build logs
        if: failure()
        uses: ./.github/workflows/upload_build_logs

      - name: Generate zip archive to release
        shell: bash
        run: |
          cd ${GITHUB_WORKSPACE}/build/build-sparrow-hawk/tmp/deploy/images/
          zip -ry -s 1900m deploy_sparrow-hawk.zip sparrow-hawk
          cd ${GITHUB_WORKSPACE}/build/build-sparrow-hawk/tmp/deploy/images/sparrow-hawk
          zip -r ${GITHUB_WORKSPACE}/build/build-sparrow-hawk/tmp/deploy/ipl-burning.zip ./ipl-burning
          cd ${GITHUB_WORKSPACE}/build/build-sparrow-hawk/tmp/deploy
          zip -ry -s 1900m deploy_spdx_split.zip spdx/
          zip -ry -s 1900m deploy_sources_split.zip sources/
          # The package lists are published as they are. The next release
          # downloads them to compare the packages with this release.
          for img in minimal weston; do
            cp -L ${GITHUB_WORKSPACE}/build/build-sparrow-hawk/tmp/deploy/images/sparrow-hawk/core-image-${img}-sparrow-hawk.rootfs.manifest \
                ${GITHUB_WORKSPACE}/build/build-sparrow-hawk/tmp/deploy/core-image-${img}-sparrow-hawk.manifest
          done
          cd $GITHUB_WORKSPACE

      - name: Prepare release tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE
          BRANCH="${{ github.ref_name }}"
          if [[ "$BRANCH" == "scarthgap" ]]; then
            # ex.) vYYYY-MM-DD
            RELEASE_VER=$(grep 'BSP_VERSION ??=' recipes-bsp/bsp-info/bsp-info.bb | cut -d'"' -f2 || true)
            if [[ -z "$RELEASE_VER" ]]; then
              echo "TAG_NAME=v$(date +'%Y-%m-%d')" >> $GITHUB_ENV
            else
              echo "TAG_NAME=${RELEASE_VER}" >> $GITHUB_ENV
            fi
          elif [[ "$BRANCH" == *-dev ]]; then
            echo "TAG_NAME=dev-latest" >> $GITHUB_ENV
          elif [[ "$BRANCH" == *-next ]]; then
            echo "TAG_NAME=next-release" >> $GITHUB_ENV
          fi

      - name: Install GitHub CLI
        shell: bash
        run: sudo apt install -y gh

      - name: Prepare release message
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          BRANCH="${{ github.ref_name }}" TAG_NAME="${{ env.TAG_NAME }}" \
              ./scripts/gen_release_notes.sh "${{ github.workspace }}-release_msg.txt"
          cat "${{ github.workspace }}-release_msg.txt" >> "$GITHUB_STEP_SUMMARY"

      - name: Delete stale draft releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          # Draft releases are not found by "gh release view", delete them by id
          gh api repos/${{ github.repository }}/releases --paginate \
            -q '.[] | select(.draft and .tag_name == "${{ env.TAG_NAME }}") | .id' |
          while read -r id; do
            echo "Deleting stale draft release: ${id}"
            gh api -X DELETE repos/${{ github.repository }}/releases/${id}
          done

      - name: Delete release tag if it exists
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          # Delete old release/tags if exists
          if gh release view "${{ env.TAG_NAME }}" --repo ${{ github.repository }} >/dev/null 2>&1; then
            echo "Deleting old release: ${{ env.TAG_NAME }}"
            gh release delete "${{ env.TAG_NAME }}" --repo ${{ github.repository }} --yes
          fi
          if git ls-remote --tags origin | grep "refs/tags/${{ env.TAG_NAME }}$" >/dev/null; then
            echo "Deleting old tag: ${{ env.TAG_NAME }}"
            git push origin ":refs/tags/${{ env.TAG_NAME }}"
          fi

      - name: Setup release configuration
        id: prerelease
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME}" == *-dev ]]; then
            echo "PRERELEASE=true" >> $GITHUB_ENV
            echo "RELEASE_TITLE=Development Latest" >> $GITHUB_ENV
          elif [[ "${GITHUB_REF_NAME}" == *-next ]]; then
            echo "PRERELEASE=true" >> $GITHUB_ENV
            echo "RELEASE_TITLE=Next release candidate" >> $GITHUB_ENV
          else
            echo "PRERELEASE=false" >> $GITHUB_ENV
            echo "RELEASE_TITLE=Release ${{ env.TAG_NAME }}" >> $GITHUB_ENV
          fi

      - name: Create/update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          target_commitish: ${{ github.ref_name }}
          name: ${{ env.RELEASE_TITLE }}
          draft: false
          prerelease: ${{ env.PRERELEASE }}
          files: |
            ./build/build-sparrow-hawk/tmp/deploy/images/deploy_sparrow-hawk.z*
            ./build/build-sparrow-hawk/tmp/deploy/deploy_spdx_split.z*
            ./build/build-sparrow-hawk/tmp/deploy/deploy_sources_split.z*
            ./build/build-sparrow-hawk/tmp/deploy/ipl-burning.zip
            ./build/build-sparrow-hawk/tmp/deploy/core-image-*-sparrow-hawk.manifest
            ./build/build-sparrow-hawk/tmp/deploy/images/*/core-image-*-sparrow-hawk.rootfs.wic.*
          body_path: ${{ github.workspace }}-release_msg.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

