name: Build test using kernel 6.12 for Sparrow-hawk
run-name: Build test using kernel 6.12 for Sparrow-hawk
on:
  push:
    branches:
      - 'scarthgap'
      - '*-dev'
      - '*-next'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Release:
    name: Release
    if: github.repository_owner == 'rcar-community'
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup build envrionment
        uses: ./.github/workflows/setup_build_env

      - name: Run build
        shell: bash
        run: |
          ./build.sh --console --rm-work --kernel-version 6.12
          ./build.sh --weston  --rm-work --kernel-version 6.12

      - name: Upload build logs
        if: failure()
        uses: ./.github/workflows/upload_build_logs
